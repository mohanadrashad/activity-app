<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Login Modal -->
  <div id="loginModal" class="modal-overlay">
    <div class="modal">
      <h2>Admin Login</h2>
      <div id="loginError" class="message"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Enter admin password">
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
      </form>
    </div>
  </div>

  <!-- Dashboard (hidden until login) -->
  <div id="dashboard" class="container" style="display:none;">
    <h1>Admin Dashboard</h1>

    <div class="tabs">
      <div class="tab active" data-tab="activities">Activities</div>
      <div class="tab" data-tab="participants">Participants</div>
    </div>

    <!-- Activities Tab -->
    <div id="tab-activities" class="tab-content active">
      <div class="card">
        <h2>Create New Activity</h2>
        <form id="activityForm">
          <div class="form-row">
            <div class="form-group">
              <label for="actName">Activity Name</label>
              <input type="text" id="actName" required placeholder="e.g. Morning Run">
            </div>
            <div class="form-group">
              <label for="actPoints">Points</label>
              <input type="number" id="actPoints" required min="0" placeholder="e.g. 10">
            </div>
            <div class="form-group">
              <label for="actDate">Active Date</label>
              <input type="date" id="actDate" required>
            </div>
          </div>
          <button type="submit" class="btn btn-success" id="actSubmitBtn">Create Activity</button>
        </form>
      </div>

      <div class="card">
        <h2>All Activities</h2>
        <div id="activitiesTableWrapper">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Points</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="activitiesBody"></tbody>
          </table>
        </div>
        <p id="noActivities" class="no-data" style="display:none;">No activities created yet.</p>
      </div>
    </div>

    <!-- Participants Tab -->
    <div id="tab-participants" class="tab-content">
      <div class="card">
        <div class="section-header">
          <h2>Participants Ranking</h2>
          <button class="btn btn-export" onclick="exportExcel()">Export to Excel</button>
        </div>
        <div id="participantsTableWrapper">
          <table>
            <thead>
              <tr>
                <th>Rank</th>
                <th>Name</th>
                <th>Email</th>
                <th>Total Points</th>
                <th>Activities</th>
              </tr>
            </thead>
            <tbody id="participantsBody"></tbody>
          </table>
        </div>
        <p id="noParticipants" class="no-data" style="display:none;">No participants registered yet.</p>
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
