<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بادر - Bader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="brand-header">
    <div class="lang-toggle">
      <button onclick="setLang('en')" id="btn-en" class="lang-btn active">English</button>
      <button onclick="setLang('ar')" id="btn-ar" class="lang-btn">العربية</button>
    </div>
    <div class="brand-logo">بادر</div>
    <div class="brand-logo-en">Bader</div>
    <p class="brand-subtitle" data-i18n="subtitle">Register for today's available activities</p>
  </header>

  <div class="container">
    <div class="card">
      <div id="message" class="message"></div>

      <form id="registrationForm">
        <div class="form-row">
          <div class="form-group">
            <label for="firstName" data-i18n="firstName">First Name *</label>
            <input type="text" id="firstName" required data-i18n-placeholder="firstNamePlaceholder" placeholder="Enter first name">
          </div>
          <div class="form-group">
            <label for="lastName" data-i18n="lastName">Last Name *</label>
            <input type="text" id="lastName" required data-i18n-placeholder="lastNamePlaceholder" placeholder="Enter last name">
          </div>
        </div>

        <div class="form-group">
          <label for="email" data-i18n="email">Email *</label>
          <input type="email" id="email" required data-i18n-placeholder="emailPlaceholder" placeholder="Enter your email">
        </div>

        <div class="form-group">
          <label for="activity" data-i18n="selectActivity">Select Activity *</label>
          <select id="activity" required>
            <option value="" data-i18n="selectOption">-- Select an activity --</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn" data-i18n="submit">Submit Registration</button>
      </form>
    </div>

    <div style="text-align:center; margin-top: 10px;">
      <a href="ranking.html" class="btn btn-view-participants" style="padding: 10px 28px; font-size: 15px;" data-i18n="viewRanking">View Ranking</a>
    </div>

    <footer class="page-footer">
      <div class="footer-line"></div>
      <span data-i18n="footer">Bader - Activity Registration Platform</span>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
