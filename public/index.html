<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Activity Registration</h1>
    <p class="subtitle">Register for today's available activities</p>

    <div class="card">
      <div id="message" class="message"></div>

      <form id="registrationForm">
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">First Name *</label>
            <input type="text" id="firstName" required placeholder="Enter first name">
          </div>
          <div class="form-group">
            <label for="middleName">Middle Name</label>
            <input type="text" id="middleName" placeholder="Enter middle name">
          </div>
          <div class="form-group">
            <label for="lastName">Last Name *</label>
            <input type="text" id="lastName" required placeholder="Enter last name">
          </div>
        </div>

        <div class="form-group">
          <label for="activity">Select Activity *</label>
          <select id="activity" required>
            <option value="">-- Select an activity --</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">Submit Registration</button>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
